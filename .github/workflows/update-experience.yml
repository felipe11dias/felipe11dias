name: Atualizar tempo de experiência

on:
  schedule:
    # Dia 1 de cada mês, às 01:00 em Fortaleza (04:00 UTC).
    - cron: '0 4 1 * *'
  push:
    branches: [main]
    paths:
      - data/experience.json
      - scripts/generate-experience.mjs
      - .github/workflows/update-experience.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar SVG e README
        run: node scripts/generate-experience.mjs

      - name: Publicar se houve mudança
        run: |
          if git diff --quiet -- README.md assets/experience.svg; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/experience.svg
          git commit -m "chore: atualiza tempo de experiência"
          git push
