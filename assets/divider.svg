<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" role="img" aria-label="Divisor">
<style>
.pk{offset-rotate:0deg;animation:mv linear infinite}
@keyframes mv{0%{offset-distance:0%;opacity:0}6%{opacity:1}94%{opacity:1}100%{offset-distance:100%;opacity:0}}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<path d="M0 12H1000" stroke="#5b6b8c" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="4 7" fill="none"/>
<circle class="pk" r="4" fill="#14b8a6" style="offset-path:path('M0 12H1000');animation-duration:8s;animation-delay:0s"/><circle class="pk" r="4" fill="#f59e0b" style="offset-path:path('M0 12H1000');animation-duration:8s;animation-delay:-4s"/>
</svg>
